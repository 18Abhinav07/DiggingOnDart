[project]
name = "dartbench"
version = "0.1.0"
description = "On-device inference benchmark for Apple Silicon, measured against Dart Browser's published limits"
readme = "README.md"
authors = [
    { name = "Abhinav Pangaria", email = "127080854+18Abhinav07@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.scripts]
dartbench = "dartbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
