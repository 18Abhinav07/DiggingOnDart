<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dartbench</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --good-text: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --band-prefill: rgba(235,104,52,0.10); --band-decode: rgba(42,120,214,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-text: #0ca30c;
    --band-prefill: rgba(217,89,38,0.16); --band-decode: rgba(57,135,229,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-text: #0ca30c;
  --band-prefill: rgba(217,89,38,0.16); --band-decode: rgba(57,135,229,0.14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
header { display: flex; align-items: center; gap: 12px; padding: 20px 0 12px; flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 600; margin: 0; }
.tag { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
.tag.fake { color: var(--ink); border-color: var(--serious); }
.live { margin-left: auto; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.dot.on { background: var(--good); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
nav { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin-bottom: 20px; overflow-x: auto; align-items: end; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); font: inherit; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
nav .sp { flex: 1; }
select, input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
nav select { margin: 0 0 6px; }
h2 { font-size: 15px; font-weight: 600; margin: 28px 0 4px; }
h2:first-child { margin-top: 0; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; max-width: 760px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .l { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .d { font-size: 12px; color: var(--muted); }
.hero { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.hero .v { font-size: 48px; font-weight: 600; line-height: 1.1; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.status i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; color: #fff; }
.st-good i { background: var(--good); } .st-bad i { background: var(--critical); } .st-warn i { background: var(--warning); color: #000; } .st-none i { background: var(--axis); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 6px 10px 6px 0; white-space: nowrap; }
td { border-bottom: 1px solid var(--grid); padding: 6px 10px 6px 0; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); } tr.sel td { background: var(--wash); }
.iqr { color: var(--muted); font-size: 12px; }
.err { color: var(--critical); }
.muted { color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .row { grid-template-columns: 1fr; } .hero .v { font-size: 36px; } }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .ttl { fill: var(--ink); font-size: 13px; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--c); }
.legend span.sq::before { width: 10px; height: 10px; border-radius: 2px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 10; max-width: 320px; }
#tip b { font-weight: 600; } #tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.empty { color: var(--muted); padding: 24px 0; }
code { font-size: 12px; background: var(--wash); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>dartbench</h1>
    <span class="tag" id="dbname"></span>
    <span class="tag fake" id="fake" hidden>fake data</span>
    <span class="live"><span class="dot" id="livedot"></span><span id="livetext">idle</span></span>
  </header>
  <nav id="nav">
    <button data-t="overview">Overview</button>
    <button data-t="limits">Limits · E0 E1</button>
    <button data-t="cache">Cache · E1b</button>
    <button data-t="memory">Memory · E2</button>
    <button data-t="spec">Speculative · E3</button>
    <button data-t="frames">Frames · E4</button>
    <button data-t="soak">Soak & energy · E5 E6</button>
    <button data-t="runs">All runs</button>
    <span class="sp"></span>
    <select id="scope" title="Which sessions to analyse">
      <option value="auto">full runs (else quick)</option><option value="full">full only</option>
      <option value="quick">quick only</option><option value="all">all sessions</option>
    </select>
  </nav>
  <main id="view"></main>
</div>
<div id="tip"></div>
<script>
// ------------------------------------------------------------ utils
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (v, d = 0) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const pctf = (v, d = 1) => v == null ? '–' : num(v, d) + '%';
const ago = t => { if (!t) return '–'; const s = Date.now() / 1000 - t; return s < 60 ? `${s | 0}s ago` : s < 3600 ? `${s / 60 | 0}m ago` : s < 86400 ? `${(s / 3600).toFixed(1)}h ago` : new Date(t * 1000).toLocaleDateString(); };
const when = t => t ? new Date(t * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
const dur = (a, b) => { if (!a) return '–'; const s = (b || Date.now() / 1000) - a; return s < 3600 ? `${(s / 60).toFixed(0)} min` : `${(s / 3600).toFixed(1)} h`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SER = ['--s1', '--s2', '--s3'];
let scope = 'auto';
try { scope = localStorage.getItem('db-scope') || 'auto'; } catch (e) {}
async function api(path, params = {}) {
  const q = new URLSearchParams({ scope, ...params });
  const r = await fetch(`${path}?${q}`);
  return r.json();
}
const med = (s, d = 0) => !s || !s.n ? '–' : `${num(s.median, d)}${s.n >= 3 ? ` <span class="iqr">${num(s.p25, d)}–${num(s.p75, d)}</span>` : ''}`;
function status(v, labels = ['pass', 'fail']) {
  if (v == null) return `<span class="status st-none"><i>–</i><span class="muted">n/a</span></span>`;
  return v ? `<span class="status st-good"><i>✓</i>${labels[0]}</span>` : `<span class="status st-bad"><i>✕</i>${labels[1]}</span>`;
}
function table(cols, rows, opts = {}) {
  if (!rows.length) return `<div class="empty">${opts.empty || 'No data yet.'}</div>`;
  const head = cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.h}</th>`).join('');
  const body = rows.map((r, i) => `<tr class="${opts.click ? 'click' : ''}" data-i="${i}">${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bindRows(el, rows, fn) {
  el.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    el.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
    tr.classList.add('sel'); fn(rows[+tr.dataset.i]);
  });
}
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
const hideTip = () => tip.style.display = 'none';
function legend(items, sq) { return `<div class="legend">${items.map(i => `<span class="${sq ? 'sq' : ''}" style="--c:${i.c}">${esc(i.name)}</span>`).join('')}</div>`; }
function ticks(lo, hi, n = 5) {
  if (hi === lo) hi = lo + 1;
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0)), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const compact = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(Math.abs(v) >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K' : (Math.abs(v) < 10 && v % 1 ? v.toFixed(1) : String(Math.round(v)));

// ------------------------------------------------------------ line chart (crosshair + tooltip)
function lineChart(el, { series, xLabel = '', yLabel = '', refs = [], bands = [], yMin, yMax, xfmt = compact, yfmt = compact, h = 240, points = true }) {
  const W = el.clientWidth || 600, H = h, m = { l: 48, r: 16, t: 12, b: 34 };
  const all = series.flatMap(s => s.pts).filter(p => p[1] != null);
  if (!all.length) { el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]).concat(refs.map(r => r.y));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  let y0 = yMin ?? Math.min(0, ...ys), y1 = yMax ?? Math.max(...ys) * 1.08;
  const yt = ticks(y0, y1); y1 = Math.max(y1, yt[yt.length - 1]);
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (Math.min(v, y1) - y0) / (y1 - y0) * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  bands.forEach(b => s += `<rect x="${X(b.x0)}" y="${m.t}" width="${Math.max(1, X(b.x1) - X(b.x0))}" height="${H - m.t - m.b}" fill="${b.fill}"/>`);
  yt.forEach(v => s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--grid')}" stroke-width="1"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${yfmt(v)}</text>`);
  ticks(x0, x1, Math.max(2, Math.min(8, (W / 90) | 0))).forEach(v => s += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${xfmt(v)}</text>`);
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${css('--axis')}"/>`;
  refs.forEach(r => s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${css('--ink-2')}" stroke-width="1"/><text x="${W - m.r}" y="${Y(r.y) - 5}" text-anchor="end" style="fill:${css('--ink-2')}">${esc(r.label)}</text>`);
  series.forEach(sr => {
    const p = sr.pts.filter(q => q[1] != null);
    if (p.length > 1) s += `<path d="${p.map((q, i) => (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join('')}" fill="none" stroke="${sr.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (points || p.length === 1) p.forEach(q => s += `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="4" fill="${sr.c}" stroke="${css('--surface')}" stroke-width="2"/>`);
  });
  if (xLabel) s += `<text x="${W - m.r}" y="${H - 4}" text-anchor="end">${esc(xLabel)}</text>`;
  if (yLabel) s += `<text x="${m.l}" y="${m.t - 2}" text-anchor="start">${esc(yLabel)}</text>`;
  s += `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="${css('--axis')}" visibility="hidden"/><rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), xsAll = [...new Set(xs)].sort((a, b) => a - b);
  svg.querySelector('.hit').onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const near = xsAll.reduce((a, b) => Math.abs(b - xv) < Math.abs(a - xv) ? b : a);
    xh.setAttribute('x1', X(near)); xh.setAttribute('x2', X(near)); xh.setAttribute('visibility', 'visible');
    const rows = series.map(sr => { const q = sr.pts.find(p => p[0] === near); return q && q[1] != null ? `<div><span class="k" style="background:${sr.c}"></span>${esc(sr.name)}: <b>${yfmt(q[1])}</b>${q[2] ? ' ' + esc(q[2]) : ''}</div>` : ''; }).join('');
    showTip(e, `<div class="muted">${esc(xLabel)} ${xfmt(near)}</div>${rows}`);
  };
  svg.querySelector('.hit').onmouseleave = () => { hideTip(); xh.setAttribute('visibility', 'hidden'); };
}

// ------------------------------------------------------------ dot + IQR range chart against a limit
function rangeChart(el, { rows, limit, limitLabel, unit, better, title }) {
  rows = rows.filter(r => r.s && r.s.n);
  if (!rows.length) { el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = el.clientWidth || 520, rh = 26, m = { l: 108, r: 20, t: 26, b: 26 }, H = m.t + m.b + rows.length * rh;
  const hi = Math.max(limit, ...rows.map(r => r.s.max)) * 1.08, X = v => m.l + v / hi * (W - m.l - m.r);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}"><text class="ttl" x="0" y="14">${esc(title)}</text>`;
  ticks(0, hi).forEach(v => s += `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}" stroke="${css('--grid')}"/><text x="${X(v)}" y="${H - m.b + 15}" text-anchor="middle">${compact(v)}</text>`);
  s += `<line x1="${X(limit)}" x2="${X(limit)}" y1="${m.t - 4}" y2="${H - m.b}" stroke="${css('--ink-2')}" stroke-width="1.5"/><text x="${X(limit) + 4}" y="${m.t + 6}" style="fill:${css('--ink-2')}">${esc(limitLabel)}</text>`;
  rows.forEach((r, i) => {
    const y = m.t + i * rh + rh / 2, ok = better === 'lower' ? r.s.median < limit : r.s.median > limit;
    const c = ok ? css('--s1') : css('--critical');
    s += `<text x="${m.l - 10}" y="${y + 4}" text-anchor="end" style="fill:${css('--ink')}">${esc(r.label)}</text>`;
    s += `<line x1="${X(r.s.p25)}" x2="${X(r.s.p75)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity=".28"/>`;
    s += `<line x1="${X(r.s.min)}" x2="${X(r.s.max)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="1" opacity=".5"/>`;
    s += `<circle cx="${X(r.s.median)}" cy="${y}" r="5" fill="${c}" stroke="${css('--surface')}" stroke-width="2"/>`;
    s += `<rect class="hit" data-i="${i}" x="0" y="${y - rh / 2}" width="${W}" height="${rh}" fill="transparent"/>`;
  });
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('.hit').forEach(h => {
    h.onmousemove = e => { const r = rows[+h.dataset.i], ok = better === 'lower' ? r.s.median < limit : r.s.median > limit;
      showTip(e, `<b>${esc(r.label)}</b><div>median ${num(r.s.median, unit === 'tok/s' ? 1 : 0)} ${unit} · ${ok ? '✓ within limit' : '✕ outside limit'}</div><div class="muted">IQR ${num(r.s.p25)}–${num(r.s.p75)} · range ${num(r.s.min)}–${num(r.s.max)} · n=${r.s.n}</div>`); };
    h.onmouseleave = hideTip;
  });
}

// ------------------------------------------------------------ labelled scatter (trade-off plot)
function scatter(el, pts, { xLabel, yLabel, legendItems = [], h = 300 }) {
  if (!pts.length) { el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = el.clientWidth || 700, H = h, m = { l: 48, r: 24, t: 14, b: 34 };
  const xt = ticks(0, Math.max(...pts.map(p => p.x)) * 1.1), yt = ticks(0, Math.max(5, ...pts.map(p => p.y)) * 1.15);
  const x1 = xt[xt.length - 1], y1 = yt[yt.length - 1];
  const X = v => m.l + v / x1 * (W - m.l - m.r), Y = v => H - m.b - v / y1 * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  yt.forEach(v => s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--grid')}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${compact(v)}</text>`);
  xt.forEach(v => s += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${compact(v)}</text>`);
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${css('--axis')}"/>`;
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(5)}" y2="${Y(5)}" stroke="${css('--ink-2')}" stroke-dasharray="3 3"/><text x="${W - m.r}" y="${Y(5) - 5}" text-anchor="end" style="fill:${css('--ink-2')}">5% decision threshold</text>`;
  pts.forEach((p, i) => {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.c}" stroke="${css('--surface')}" stroke-width="2"/>`;
    s += `<text x="${X(p.x) + 8}" y="${Y(p.y) + 4}" style="fill:${css('--ink-2')}">${esc(p.label)}</text>`;
    s += `<circle class="hit" data-i="${i}" cx="${X(p.x)}" cy="${Y(p.y)}" r="12" fill="transparent"/>`;
  });
  s += `<text x="${W - m.r}" y="${H - 4}" text-anchor="end">${esc(xLabel)}</text><text x="${m.l}" y="${m.t - 4}">${esc(yLabel)}</text></svg>`;
  el.innerHTML = legend(legendItems) + s;
  el.querySelectorAll('.hit').forEach(c => {
    c.onmousemove = e => { const p = pts[+c.dataset.i]; showTip(e, `<b>${esc(p.label)}</b><div>TTFT ${num(p.x, 1)} s · dropped ${pctf(p.y)}</div><div class="muted">${esc(p.extra || '')}</div>`); };
    c.onmouseleave = hideTip;
  });
}

// ------------------------------------------------------------ frame timeline
function frameChart(el, data, budget) {
  const f = data.frames, ph = data.phases;
  if (!f.length) { el.innerHTML = '<div class="empty">No frames for this condition yet.</div>'; return; }
  const W = el.clientWidth || 900, H = 260, m = { l: 44, r: 12, t: 12, b: 30 };
  const t1 = Math.max(...ph.map(p => p.t1), f[f.length - 1][0]), cap = Math.max(budget * 6, 50);
  const X = v => m.l + v / t1 * (W - m.l - m.r), Y = v => H - m.b - Math.min(v, cap) / cap * (H - m.t - m.b);
  const fills = { prefill: css('--band-prefill'), decode: css('--band-decode') };
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  ph.forEach(p => { if (fills[p.phase]) s += `<rect x="${X(p.t0)}" y="${m.t}" width="${Math.max(1, X(p.t1) - X(p.t0))}" height="${H - m.t - m.b}" fill="${fills[p.phase]}"/>`; });
  ticks(0, cap, 4).forEach(v => s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--grid')}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${compact(v)}</text>`);
  ticks(0, t1 / 1000, 8).forEach(v => s += `<text x="${X(v * 1000)}" y="${H - m.b + 16}" text-anchor="middle">${compact(v)}s</text>`);
  const drop = budget * 1.5;
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(drop)}" y2="${Y(drop)}" stroke="${css('--ink-2')}"/><text x="${W - m.r}" y="${Y(drop) - 4}" text-anchor="end" style="fill:${css('--ink-2')}">dropped above ${num(drop, 1)} ms</text>`;
  let ok = '', bad = '';
  f.forEach(([t, d]) => { if (d > drop) bad += `<circle cx="${X(t).toFixed(1)}" cy="${Y(d).toFixed(1)}" r="3.5"/>`; else ok += `M${X(t).toFixed(1)},${Y(d).toFixed(1)}h0.01`; });
  s += `<path d="${ok}" stroke="${css('--muted')}" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>`;
  s += `<g fill="${css('--critical')}" stroke="${css('--surface')}" stroke-width="1.5">${bad}</g>`;
  s += `<text x="${m.l}" y="${m.t - 2}">frame interval, ms (capped at ${compact(cap)})</text>`;
  s += `<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg');
  svg.querySelector('.hit').onmousemove = e => {
    const r = svg.getBoundingClientRect(), t = ((e.clientX - r.left) * W / r.width - m.l) / (W - m.l - m.r) * t1;
    const p = ph.find(p => t >= p.t0 && t <= p.t1);
    const win = f.filter(q => Math.abs(q[0] - t) < 250).map(q => q[1]);
    const worst = win.length ? Math.max(...win) : null;
    showTip(e, `<div class="muted">${(t / 1000).toFixed(2)} s · ${p ? p.phase : '–'}</div><div>worst interval ±250 ms: <b>${num(worst, 1)} ms</b></div><div class="muted">${win.length} frames in window</div>`);
  };
  svg.querySelector('.hit').onmouseleave = hideTip;
}

views.soak = async el => {
  const [s, e6] = await Promise.all([api('/api/e5'), api('/api/e6')]);
  el.innerHTML = `<h2>E5 · sustained load</h2><p class="sub">Requests run back to back for ${num(s.minutes, 0)} minutes with no gaps. A short benchmark measures a cool chip; this measures the chip after it has warmed up.${s.sustained_drop_pct != null ? ` Decode went from ${num(s.first_min_tps, 1)} to ${num(s.last_min_tps, 1)} tok/s (${num(s.sustained_drop_pct, 1)}% lower).` : ''}</p>
    <div class="row"><div class="card"><div class="chart" id="c1"></div></div><div class="card"><div class="chart" id="c2"></div></div></div>
    <h2>E6 · energy per token</h2><p class="sub">CPU and GPU power from <code>powermetrics</code>, integrated separately over prefill and decode. Needs <code>sudo -v</code> before the run.</p><div class="card" id="t"></div>`;
  const ser = s.series || [];
  lineChart($('#c1', el), { series: [{ name: 'decode tok/s', c: css('--s1'), pts: ser.map(p => [p.min, p.gen_tps, p.thermal || '']) }], xLabel: 'minutes', yLabel: 'decode, tok/s', points: ser.length < 60, xfmt: v => num(v, 1), yfmt: v => num(v, 1) });
  lineChart($('#c2', el), { series: [{ name: 'TTFT ms', c: css('--s1'), pts: ser.map(p => [p.min, p.ttft_ms]) }], xLabel: 'minutes', yLabel: 'TTFT at 2k, ms', points: ser.length < 60, xfmt: v => num(v, 1) });
  $('#t', el).innerHTML = table([
    { h: 'Config', f: r => esc(r.model) }, { h: 'Decode J/token', f: r => med(r.j_per_tok, 3), n: 1 }, { h: 'Prefill J/1k tok', f: r => med(r.prefill_j_per_ktok, 1), n: 1 },
    { h: 'CPU W', f: r => med(r.cpu_w, 1), n: 1 }, { h: 'GPU W', f: r => med(r.gpu_w, 1), n: 1 }, { h: 'Decode tok/s', f: r => med(r.gen_tps, 1), n: 1 },
  ], e6, { empty: 'E6 has not run (it needs <code>--energy</code> and <code>sudo -v</code>).' });
};

views.runs = async el => {
  el.innerHTML = `<h2>All runs</h2><p class="sub">Every trial, newest first. Click one to see its memory over time. The line marks the first token.</p>
    <div class="filters"><select id="fx"><option value="">all experiments</option>${['E1', 'E1b', 'E2', 'E3', 'E4', 'E5', 'E6'].map(x => `<option>${x}</option>`).join('')}</select>
      <input id="fc" placeholder="condition contains…" size="22"><label><input type="checkbox" id="fe"> errors only</label><span class="muted" id="cnt"></span></div>
    <div id="mem"></div><div class="card" id="t"></div>`;
  let all = [];
  const render = () => {
    const q = $('#fc', el).value.toLowerCase(), rows = all.filter(r => !q || r.condition.toLowerCase().includes(q));
    $('#cnt', el).textContent = `${rows.length} shown`;
    $('#t', el).innerHTML = table([
      { h: '#', f: r => r.id, n: 1 }, { h: 'Exp', f: r => r.experiment }, { h: 'Condition', f: r => esc(r.condition) }, { h: 'Run', f: r => r.trial_idx, n: 1 },
      { h: 'When', f: r => when(r.t_start) }, { h: 'TTFT ms', f: r => num(r.ttft_ms), n: 1 }, { h: 'Prompt tok', f: r => num(r.prompt_n), n: 1 },
      { h: 'Decode tok/s', f: r => num(r.gen_tps, 1), n: 1 }, { h: 'Peak MB', f: r => num(r.peak_footprint_mb ?? r.peak_rss_mb), n: 1 },
      { h: 'Swap Δ MB', f: r => num((r.swap_end_mb || 0) - (r.swap_start_mb || 0)), n: 1 }, { h: 'Thermal', f: r => esc(r.thermal || '') },
      { h: 'Error', f: r => r.error ? `<span class="err" title="${esc(r.error)}">${esc(r.error.slice(0, 40))}</span>` : '' },
    ], rows.slice(0, 1000), { click: 1, empty: 'No trials match.' });
    bindRows($('#t', el), rows, showMem);
  };
  const load = async () => { all = await api('/api/trials', { exp: $('#fx', el).value, errors: $('#fe', el).checked ? '1' : '', limit: 5000 }); render(); };
  const showMem = async r => {
    const m = await api('/api/mem', { id: r.id }), s = m.samples;
    if (!s.length) { $('#mem', el).innerHTML = ''; return; }
    const t0 = m.trial.t_start || s[0].t, x = v => (v - t0);
    $('#mem', el).innerHTML = `<div class="card"><div class="sub" style="color:var(--ink);font-weight:600">#${r.id} ${esc(r.condition)}: memory during the request</div>${legend([{ name: 'server footprint', c: css('--s1') }, { name: 'system in use', c: css('--s2') }, { name: 'swap used', c: css('--s3') }])}<div class="chart" id="mc"></div></div>`;
    lineChart($('#mc', el), { series: [
      { name: 'server footprint MB', c: css('--s1'), pts: s.map(p => [x(p.t), p.footprint_mb ?? p.rss_mb]) },
      { name: 'system in use MB', c: css('--s2'), pts: s.map(p => [x(p.t), p.sys_used_mb]) },
      { name: 'swap MB', c: css('--s3'), pts: s.map(p => [x(p.t), p.swap_mb]) }],
      xLabel: 'seconds', yLabel: 'MB', points: false, h: 220, xfmt: v => num(v, 1),
      bands: m.trial.t_first ? [{ x0: 0, x1: x(m.trial.t_first), fill: css('--band-prefill') }] : [] });
  };
  $('#fx', el).onchange = load; $('#fe', el).onchange = load; $('#fc', el).oninput = render;
  load();
};

// ------------------------------------------------------------ shell
async function show(t, quiet) {
  current = t;
  try { localStorage.setItem('db-tab', t); } catch (e) {}
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const el = $('#view');
  if (!quiet) el.innerHTML = '<div class="empty">Loading…</div>';
  const y = scrollY;
  try { await views[t](el); } catch (e) { el.innerHTML = `<div class="empty err">Could not load: ${esc(e.message)}</div>`; }
  if (quiet) scrollTo(0, y);
}
async function heartbeat() {
  try {
    const o = await api('/api/overview');
    $('#dbname').textContent = o.db; $('#fake').hidden = !o.fake;
    const run = o.sessions.find(s => s.status === 'running');
    const was = live; live = !!run;
    $('#livedot').classList.toggle('on', live);
    $('#livetext').textContent = run ? `running ${run.experiment} · ${run.trials} trials · last ${ago(run.last_trial)}` : (o.sessions.length ? `idle · last session ${ago(o.sessions[0].ended_at || o.sessions[0].started_at)}` : 'no runs yet');
    // refresh the open tab while a run is writing, unless the user is reading a drill-down
    if ((live || was) && !document.querySelector('tr.sel') && current !== 'runs') show(current, true);
  } catch (e) { $('#livetext').textContent = 'dashboard server not reachable'; }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
$('#scope').value = scope;
$('#scope').onchange = e => { scope = e.target.value; try { localStorage.setItem('db-scope', scope); } catch (x) {} show(current); };
let tab = 'overview'; try { tab = localStorage.getItem('db-tab') || 'overview'; } catch (e) {}
show(views[tab] ? tab : 'overview');
heartbeat(); setInterval(heartbeat, 5000);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => show(current, true), 200); });
</script>
